<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CodeGen</title>
  <link rel="icon" href="/static/logo.png">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0d0d0d;
      --muted: #5d5d5d;
      --border: #d9d9e3;
      --field: #ffffff;
      --focus: #10a37f;
      --btn: #0d0d0d;
      --btn-text: #ffffff;
      --error-bg: #fef2f2;
      --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #212121;
        --text: #ececec;
        --muted: #b4b4b4;
        --border: #424242;
        --field: #2f2f2f;
        --btn: #ececec;
        --btn-text: #0d0d0d;
        --error-bg: #3b1f1f;
        --error: #fca5a5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card { width: 100%; max-width: 360px; text-align: center; }
    .logo { width: 56px; height: 56px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    .sub { margin: 0 0 28px; color: var(--muted); font-size: 15px; }
    form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    label { margin: 0 0 -6px 4px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(16, 163, 127, .25); }
    button {
      height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { opacity: .88; }
    .error {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--error-bg);
      color: var(--error);
      font-size: 14px;
      text-align: left;
    }
    .foot { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/logo.png" alt="">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to CodeGen, your offline coding assistant</p>
    $error_block
    <form method="post" action="/login" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" value="$username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Continue</button>
    </form>
    <p class="foot">Runs fully offline · Programming questions only<br>Need an account? Ask your administrator.</p>
  </main>
</body>
</html>
