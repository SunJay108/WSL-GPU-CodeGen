services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: never
    container_name: codegen-llama
    gpus: all
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/${MODEL_FILE:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}"
      - "--alias"
      - "qwen2.5-coder"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${CTX_SIZE:-8192}"
      - "--n-gpu-layers"
      - "${GPU_LAYERS:-20}"
      - "--threads"
      - "${CPU_THREADS:-8}"
      # Slot 0 serves chat, slot 1 the topic classifier; each gets CTX_SIZE / 2.
      - "--parallel"
      - "${LLAMA_PARALLEL:-2}"
    ports:
      # Localhost only: users must go through the UI so every message is filtered.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  guard:
    build:
      context: ./guard
    container_name: codegen-guard
    gpus: all
    environment:
      GUARD_DEVICE: ${GUARD_DEVICE:-cpu}
      GUARD_THREADS: ${GUARD_THREADS:-4}
      GUARD_STREAM_INT8: ${GUARD_STREAM_INT8:-false}
    volumes:
      - ./models/Qwen3Guard-Gen-0.6B:/models/Qwen3Guard-Gen-0.6B:ro
      - ./models/Qwen3Guard-Stream-0.6B:/models/Qwen3Guard-Stream-0.6B:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  codegen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codegen-ui
    environment:
      LLAMA_URL: http://llama-server:8080
      LLAMA_MODEL: qwen2.5-coder
      GUARD_URL: http://guard:8090
      CTX_SIZE: ${CTX_SIZE:-8192}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      REQUIRE_ENGLISH: ${REQUIRE_ENGLISH:-true}
      BLOCK_CONTROVERSIAL: ${BLOCK_CONTROVERSIAL:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "7860:7860"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    depends_on:
      llama-server:
        condition: service_healthy
      guard:
        condition: service_healthy
    restart: unless-stopped
